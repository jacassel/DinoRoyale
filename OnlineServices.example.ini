; Copy to OnlineServices.ini in the project folder, or the packaged
; Windows/DinosaurBattle folder. Fill with this game's EOS product/client values.
; The game reads this file only when Multiplayer requests EOS initialization.
; Restart the game after changing it. Keep the configured copy out of Git.
[Dino.EOS]
ProductId=REPLACE_WITH_PRODUCT_ID
SandboxId=REPLACE_WITH_SANDBOX_ID
DeploymentId=REPLACE_WITH_DEPLOYMENT_ID
ClientId=REPLACE_WITH_CLIENT_ID
ClientSecret=REPLACE_WITH_CLIENT_SECRET
